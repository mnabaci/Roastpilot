appId: app.roastpilot.desktop
productName: Roastpilot
directories:
  buildResources: build
files:
  - out/**
  - package.json
npmRebuild: true
mac:
  category: public.app-category.utilities
  # Ad-hoc signed until there is an Apple Developer ID (ADR 0017). Apple silicon refuses an app with
  # no signature at all ("damaged"); ad-hoc lets macOS offer Open Anyway instead. Hardened runtime
  # would reject Electron's own frameworks under an ad-hoc signature, and only matters for
  # notarisation.
  identity: '-'
  hardenedRuntime: false
  # The zip is what the app's own Mac installer downloads (latest-mac.yml names it); the DMG is
  # what people install.
  target:
    - dmg
    - zip
  # The helper that swaps the app after it quits (ADR 0018), found via process.resourcesPath.
  extraResources:
    - from: resources/mac-update-swap.sh
      to: mac-update-swap.sh
win:
  target:
    - nsis
nsis:
  # No spaces: GitHub renames them on upload, and latest.yml must name the file as uploaded.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
# Updates come from GitHub releases (ADR 0017): this goes into the app (app-update.yml) and the
# update files. The release workflow builds with --publish never and uploads them itself.
publish:
  provider: github
  owner: mnabaci
  repo: Roastpilot
