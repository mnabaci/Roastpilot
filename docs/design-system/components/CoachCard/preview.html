<!-- @dsCard group="Controls" height=250 subtitle="Manual mode suggestion and heads-up" -->
<!-- Opened as a file: the token variables from the repo. Served by the design system page, which supplies them. -->
<link rel="stylesheet" href="../../../../packages/ui/src/styles/tokens.css" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
/>
<style>
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-variant-numeric: tabular-nums;
  }
  .wrap {
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .card {
    width: 340px;
    border-radius: var(--radius-xl);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .muted {
    color: var(--ink-muted);
  }
  .dismiss {
    height: 44px;
    padding: 0 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-strong);
    background: var(--surface-raised);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
  }
  .dismiss:hover {
    background: var(--surface-hover);
  }
</style>
<div class="wrap">
  <section
    aria-label="Coach suggestion"
    class="card"
    style="background: var(--heat-tint); border: 1px solid var(--heat)"
  >
    <div class="label muted">Coach suggests · needs calibration</div>
    <div>
      <table style="width: 100%; border-collapse: separate; border-spacing: 0 4px">
        <tbody>
          <tr>
            <th
              scope="row"
              class="body"
              style="width: 100%; text-align: left; font-weight: 600; padding-right: 16px"
            >
              Heater
            </th>
            <td>
              <span
                class="body muted"
                style="
                  display: inline-block;
                  border-radius: var(--radius-md);
                  padding: 0 10px;
                  border: 1px solid var(--border-strong);
                "
                >75%</span
              >
            </td>
            <td class="muted" style="padding: 0 8px" aria-hidden="true">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="display: block"
              >
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
              </svg>
            </td>
            <td>
              <span
                style="
                  display: inline-block;
                  border-radius: var(--radius-md);
                  padding: 0 10px;
                  background: var(--surface);
                  border: 1px solid var(--heat);
                  color: var(--heat);
                  font-size: 26px;
                  line-height: 32px;
                  font-weight: 700;
                "
                >65%</span
              >
            </td>
          </tr>
          <tr>
            <th
              scope="row"
              class="body"
              style="width: 100%; text-align: left; font-weight: 600; padding-right: 16px"
            >
              Fan
            </th>
            <td>
              <span
                class="body muted"
                style="
                  display: inline-block;
                  border-radius: var(--radius-md);
                  padding: 0 10px;
                  border: 1px solid var(--border-strong);
                "
                >50%</span
              >
            </td>
            <td class="muted" style="padding: 0 8px" aria-hidden="true">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="display: block"
              >
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
              </svg>
            </td>
            <td>
              <span
                style="
                  display: inline-block;
                  border-radius: var(--radius-md);
                  padding: 0 10px;
                  background: var(--surface);
                  border: 1px solid var(--air);
                  color: var(--air);
                  font-size: 26px;
                  line-height: 32px;
                  font-weight: 700;
                "
                >65%</span
              >
            </td>
          </tr>
        </tbody>
      </table>
      <div class="body muted">Maillard from 165 °C</div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px">
      <button class="dismiss">Dismiss</button
      ><button
        style="
          height: 44px;
          padding: 0 20px;
          border: 0;
          border-radius: var(--radius-md);
          background: var(--heat-fill);
          color: var(--on-heat);
          font-size: 13px;
          font-weight: 600;
        "
      >
        Apply
      </button>
    </div>
  </section>
  <section
    aria-label="Coach heads-up"
    class="card"
    style="background: var(--surface-raised); border: 1px solid var(--border)"
  >
    <div class="label muted">Heads-up</div>
    <div class="body">First crack in ~45 s · listen</div>
    <div style="display: flex; justify-content: flex-end">
      <button class="dismiss">Dismiss</button>
    </div>
  </section>
</div>
<script></script>
