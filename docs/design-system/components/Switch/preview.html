<!-- @dsCard group="Inputs" height=120 subtitle="On, off, disabled" -->
<!-- Opened as a file: the token variables from the repo. Served by the design system page, which supplies them. -->
<link rel="stylesheet" href="../../../../packages/ui/src/styles/tokens.css" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
/>
<style>
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
  }
  .wrap {
    padding: 20px;
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .sw {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    height: 44px;
  }
  .t {
    position: relative;
    width: 44px;
    height: 26px;
    border-radius: var(--radius-full);
    background: var(--border-strong);
    transition: background 0.12s;
  }
  .t::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: var(--radius-full);
    background: var(--ink-muted);
    transition:
      transform 0.12s,
      background 0.12s;
  }
  .sw[aria-checked='true'] .t {
    background: var(--heat-tint);
    box-shadow: inset 0 0 0 1px var(--heat);
  }
  .sw[aria-checked='true'] .t::after {
    transform: translateX(18px);
    background: var(--heat);
  }
  .sw:focus-visible .t {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .sw:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
<div class="wrap">
  <button class="sw" role="switch" aria-checked="true" aria-label="Find the charge point">
    <span class="t"></span>
  </button>
  <button class="sw" role="switch" aria-checked="false" aria-label="Cool the drum after each roast">
    <span class="t"></span>
  </button>
  <button class="sw" role="switch" aria-checked="true" aria-label="Disabled" disabled>
    <span class="t"></span>
  </button>
</div>
<script>
  document
    .querySelectorAll('.sw:not(:disabled)')
    .forEach((b) =>
      b.addEventListener('click', () =>
        b.setAttribute('aria-checked', b.getAttribute('aria-checked') !== 'true'),
      ),
    );
</script>
