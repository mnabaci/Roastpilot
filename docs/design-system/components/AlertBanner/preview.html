<link

<style>
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-variant-numeric: tabular-nums;
  }
  .wrap {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    border-radius: var(--radius-lg);
    border: 1px solid;
  }
  .critical {
    background: var(--critical-surface);
    border-color: var(--critical);
  }
  .warning {
    background: var(--surface-raised);
    border-color: var(--warning);
  }
  p {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    line-height: 22px;
    font-weight: 600;
  }
  svg {
    width: 20px;
    height: 20px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .critical svg {
    color: var(--critical-text);
  }
  .warning svg {
    color: var(--warning);
  }
  /* Button, Outline variant, size sm. */
  button {
    flex: none;
    height: var(--control-sm);
    min-width: var(--control-sm);
    padding: 0 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-strong);
    background: var(--surface-raised);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover {
    background: var(--surface-hover);
  }
  button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
</style>
