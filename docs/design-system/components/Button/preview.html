<!-- @dsCard group="Actions" height=250 subtitle="Primary, tonal, ghost, danger, disabled" -->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
/>
<style>
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
  }
  .wrap {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 360px;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 0;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition:
      background 0.12s,
      transform 0.08s;
  }
  .btn:active {
    transform: scale(0.98);
  }
  .btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .btn svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .primary {
    height: 56px;
    background: var(--heat-fill);
    color: var(--on-heat);
    font-size: 16px;
  }
  .primary:hover {
    background: var(--heat-fill-hover);
  }
  .tonal {
    height: 48px;
    padding: 0 16px;
    background: var(--surface-raised);
    color: var(--ink);
    font-size: 15px;
  }
  .tonal:hover {
    background: var(--surface-hover);
  }
  .ghost {
    height: 48px;
    padding: 0 14px;
    background: transparent;
    color: var(--ink-muted);
    font-size: 15px;
  }
  .ghost:hover {
    background: var(--surface-hover);
    color: var(--ink);
  }
  .danger {
    height: 52px;
    background: var(--critical);
    color: #ffffff;
    font-size: 15px;
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
</style>
<div class="wrap">
  <button class="btn primary">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
      ></path></svg
    >Preheat
  </button>
  <div class="row">
    <button class="btn tonal" style="flex: 1">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 17V3"></path>
        <path d="m6 11 6 6 6-6"></path>
        <path d="M19 21H5"></path></svg
      >Drop now
    </button>
    <button class="btn ghost">Dismiss</button>
    <button class="btn tonal" disabled>Heating…</button>
  </div>
  <button class="btn danger">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <polygon
        points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"
      ></polygon>
      <path d="m15 9-6 6"></path>
      <path d="m9 9 6 6"></path></svg
    >Emergency stop
  </button>
</div>
<script></script>
