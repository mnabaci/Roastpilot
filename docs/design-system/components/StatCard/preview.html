<!-- Opened as a file: the token variables from the repo. Served by the design system page, which supplies them. -->
<link rel="stylesheet" href="../../../../packages/ui/src/styles/tokens.css" />
<link

<style>
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans, Inter, system-ui, sans-serif);
    font-size: 15px;
    line-height: 22px;
  }
  .wrap {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .label {
    font-size: 13px;
    line-height: 18px;
    font-weight: 500;
  }
  .heading {
    font-size: 17px;
    line-height: 24px;
    font-weight: 600;
  }
  .muted {
    color: var(--ink-muted);
  }
  .num {
    font-variant-numeric: tabular-nums;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius-xl);
  }
  button {
    font-family: inherit;
  }
  svg {
    flex: none;
  }
  :focus-visible {
    outline: 2px solid var(--focus);

          gap: 4px;

        <span style="display: flex; align-items: baseline; gap: 6px"
          ><span
            class="num"
            style="font-size: 26px; line-height: 32px; font-weight: 700; color: var(--ink)"
            >22.1</span
          ><span class="label muted">°C</span></span
        >
        <span class="label muted">Not used</span>
      </div>
    </div>
