<!-- @dsCard group="Data" height=170 subtitle="Temperature, RoR, development" -->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
/>
<style>
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-variant-numeric: tabular-nums;
  }
  .wrap {
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  button {
    font-family: inherit;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
</style>
<div class="wrap" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
  <div
    style="
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    "
  >
    <div class="label" style="color: var(--ink-muted)">Temperature</div>
    <div style="display: flex; align-items: baseline; gap: 6px">
      <span class="readout-xl" style="color: var(--heat)">198</span
      ><span style="font-size: 20px; color: var(--ink-muted)">°C</span>
    </div>
    <div class="label" style="color: var(--ink-muted)">Target 196 °C</div>
  </div>
  <div
    style="
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    "
  >
    <div class="label" style="color: var(--ink-muted)">Rate of rise</div>
    <div style="display: flex; align-items: baseline; gap: 6px">
      <span class="readout-xl" style="color: var(--air)">8.6</span
      ><span style="font-size: 20px; color: var(--ink-muted)">°C/min</span>
    </div>
    <div class="label" style="color: var(--ink-muted)">Last 30 s</div>
  </div>
  <div
    style="
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    "
  >
    <div class="label" style="color: var(--ink-muted)">Development</div>
    <div class="readout-xl">1:12</div>
    <div class="label" style="color: var(--ink-muted)">12% of roast</div>
  </div>
</div>
