<!-- @dsCard group="Controls" height=320 subtitle="Heater in manual, fan in auto, drum speed neutral" -->
<!-- Opened as a file: the token variables from the repo. Served by the design system page, which supplies them. -->
<link rel="stylesheet" href="../../../../packages/ui/src/styles/tokens.css" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
/>
<style>
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-variant-numeric: tabular-nums;
  }
  .wrap {
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  button {
    font-family: inherit;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
</style>
<div class="wrap">
  <div
    style="
      width: 340px;
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    "
  >
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <label for="h" style="font-size: 15px; font-weight: 600">Heater</label>
        <div style="display: flex; align-items: center; gap: 10px">
          <span
            class="badge"
            style="
              padding: 4px 8px;
              border-radius: var(--radius-sm);
              background: var(--heat-tint);
              color: var(--heat);
            "
            >MANUAL</span
          ><span
            style="
              font-size: 26px;
              line-height: 32px;
              font-weight: 700;
              min-width: 56px;
              text-align: right;
            "
            >75%</span
          >
        </div>
      </div>
      <input
        id="h"
        type="range"
        min="0"
        max="100"
        step="5"
        value="75"
        style="width: 100%; height: 28px; accent-color: var(--heat-fill)"
      /><button
        style="
          align-self: flex-start;
          height: 44px;
          padding: 0 14px;
          border-radius: var(--radius-md);
          border: 0;
          background: transparent;
          color: var(--ink);
          font-size: 13px;
          font-weight: 600;
        "
      >
        Resume auto
      </button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <label for="f" style="font-size: 15px; font-weight: 600">Fan</label>
        <div style="display: flex; align-items: center; gap: 10px">
          <span
            class="badge"
            style="
              padding: 4px 8px;
              border-radius: var(--radius-sm);
              background: var(--air-tint);
              color: var(--air);
            "
            >AUTO</span
          ><span
            style="
              font-size: 26px;
              line-height: 32px;
              font-weight: 700;
              min-width: 56px;
              text-align: right;
            "
            >35%</span
          >
        </div>
      </div>
      <input
        id="f"
        type="range"
        min="0"
        max="100"
        step="5"
        value="35"
        style="width: 100%; height: 28px; accent-color: var(--air)"
      />
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <label for="d" style="font-size: 15px; font-weight: 600">Drum</label
        ><span
          style="
            font-size: 26px;
            line-height: 32px;
            font-weight: 700;
            min-width: 56px;
            text-align: right;
          "
          >60%</span
        >
      </div>
      <input
        id="d"
        type="range"
        min="0"
        max="100"
        step="5"
        value="60"
        style="width: 100%; height: 28px; accent-color: var(--ink-muted)"
      />
    </div>
  </div>
</div>
<script></script>
