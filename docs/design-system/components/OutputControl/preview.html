<!-- @dsCard group="Controls" height=320 subtitle="Heater in manual, fan in auto, drum speed neutral" -->
<!-- Opened as a file: the token variables from the repo. Served by the design system page, which supplies them. -->
<link rel="stylesheet" href="../../../../packages/ui/src/styles/tokens.css" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
/>
<style>
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-variant-numeric: tabular-nums;
  }
  .wrap {
    padding: 20px;
  }
  .card {
    width: 340px;
    box-sizing: border-box;
    background: var(--surface);
    border-radius: var(--radius-xl);
    padding: var(--space-5);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .out {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .lab {
    font-size: 15px;
    line-height: 22px;
    font-weight: 600;
  }
  .val {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  output {
    min-width: 56px;
    text-align: right;
    font-size: 26px;
    line-height: 32px;
    font-weight: 700;
  }
  .badge {
    padding: var(--space-1) var(--space-2);
    border-radius: var(--radius-sm);
    font-size: 11px;
    line-height: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .badge.heat {
    background: var(--heat-tint);
    color: var(--heat);
  }
  .badge.air {
    background: var(--air-tint);
    color: var(--air);
  }
  /* Drawn by the app, never the browser: a border-strong track filled up to the value in the
     output's colour, and a 20px thumb in that colour with a 2px surface ring. 28px hit area. */
  .range {
    position: relative;
    height: 28px;
    cursor: pointer;
  }
  .range:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .track {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: var(--space-2);
    transform: translateY(-50%);
    border-radius: var(--radius-full, 9999px);
    background: linear-gradient(
      to right,
      var(--fill) calc(var(--at) * 100%),
      var(--border-strong) calc(var(--at) * 100%)
    );
  }
  .thumb {
    position: absolute;
    top: 50%;
    left: calc(var(--at) * (100% - var(--space-5)) + var(--space-5) / 2);
    box-sizing: border-box;
    width: var(--space-5);
    height: var(--space-5);
    transform: translate(-50%, -50%);
    border: 2px solid var(--surface);
    border-radius: var(--radius-full, 9999px);
    background: var(--fill);
  }
  /* Button, ghost variant, size sm. */
  .resume {
    align-self: flex-start;
    height: var(--control-sm);
    padding: 0 14px;
    border: 0;
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .resume:hover {
    background: var(--surface-hover);
  }
  .resume:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
</style>
<div class="wrap">
  <div class="card">
    <div class="out">
      <div class="top">
        <span class="lab">Heater</span>
        <div class="val"><span class="badge heat">Manual</span><output>75%</output></div>
      </div>
      <div
        class="range"
        role="slider"
        aria-label="Heater"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="75"
        tabindex="0"
        style="--fill: var(--heat-fill); --at: 0.75"
      >
        <span class="track"></span><span class="thumb"></span>
      </div>
      <button class="resume">Resume auto</button>
    </div>
    <div class="out">
      <div class="top">
        <span class="lab">Fan</span>
        <div class="val"><span class="badge air">Auto</span><output>35%</output></div>
      </div>
      <div
        class="range"
        role="slider"
        aria-label="Fan"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="35"
        tabindex="0"
        style="--fill: var(--air); --at: 0.35"
      >
        <span class="track"></span><span class="thumb"></span>
      </div>
    </div>
    <div class="out">
      <div class="top">
        <span class="lab">Drum</span>
        <div class="val"><output>60%</output></div>
      </div>
      <div
        class="range"
        role="slider"
        aria-label="Drum"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="60"
        tabindex="0"
        style="--fill: var(--ink-muted); --at: 0.6"
      >
        <span class="track"></span><span class="thumb"></span>
      </div>
    </div>
  </div>
</div>
<script></script>
