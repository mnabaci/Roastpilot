<!-- @dsCard group="Data" height=260 subtitle="Stock as steps, the low-stock line, and the hover card" -->
<!-- Opened as a file: the token variables from the repo. Served by the design system page, which supplies them. -->
<link rel="stylesheet" href="../../../../packages/ui/src/styles/tokens.css" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
/>
<style>
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans, Inter, system-ui, sans-serif);
    font-size: 15px;
    line-height: 22px;
  }
  .wrap {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .label {
    font-size: 13px;
    line-height: 18px;
    font-weight: 500;
  }
  .heading {
    font-size: 17px;
    line-height: 24px;
    font-weight: 600;
  }
  .muted {
    color: var(--ink-muted);
  }
  .num {
    font-variant-numeric: tabular-nums;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius-xl);
  }
  button {
    font-family: inherit;
  }
  svg {
    flex: none;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .plot {
    position: relative;
    height: 160px;
    flex: 1;
    min-width: 0;
  }
  .plot svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .tip {
    position: absolute;
    top: 0;
    margin-left: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: max-content;
    background: var(--surface-raised);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 8px 12px;
  }
</style>
<div class="wrap">
  <div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; gap: 8px">
      <div
        class="label muted num"
        aria-hidden="true"
        style="
          width: 56px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          text-align: right;
        "
      >
        <span style="margin-top: -8px">2,400 g</span><span style="margin-bottom: -8px">0</span>
      </div>
      <div
        class="plot"
        role="img"
        aria-label="Green stock from 1,200 g on 12 Oct to 1,200 g today; low-stock line 500 g"
      >
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <line
            x1="0"
            x2="100"
            y1="13.04"
            y2="13.04"
            stroke="var(--chart-grid)"
            vector-effect="non-scaling-stroke"
          />
          <line
            x1="0"
            x2="100"
            y1="100"
            y2="100"
            stroke="var(--chart-grid)"
            vector-effect="non-scaling-stroke"
          />
          <path
            d="M0 56.52 H14 V71.01 H30 V85.51 H46 V13.04 H62 V27.54 H78 V42.03 H90 V56.52 H100 V100 H0 Z"
            fill="var(--air-tint)"
          />
          <line
            x1="0"
            x2="100"
            y1="81.88"
            y2="81.88"
            stroke="var(--heat)"
            stroke-dasharray="4 4"
            vector-effect="non-scaling-stroke"
          />
          <path
            d="M0 56.52 H14 V71.01 H30 V85.51 H46 V13.04 H62 V27.54 H78 V42.03 H90 V56.52 H100"
            fill="none"
            stroke="var(--air)"
            stroke-width="2"
            stroke-linejoin="round"
            vector-effect="non-scaling-stroke"
          />
        </svg>
        <span
          class="label muted num"
          aria-hidden="true"
          style="
            position: absolute;
            right: 0;
            top: 81.88%;
            transform: translateY(-100%);
            padding-bottom: 2px;
          "
          >Low 500 g</span
        >
        <span
          aria-hidden="true"
          style="
            position: absolute;
            top: 0;
            bottom: 0;
            left: 62%;
            width: 1px;
            background: var(--border-strong);
          "
        ></span>
        <span
          aria-hidden="true"
          style="
            position: absolute;
            left: 62%;
            top: 27.54%;
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background: var(--air);
            box-shadow: 0 0 0 2px var(--surface);
            transform: translate(-50%, -50%);
          "
        ></span>
        <div
          class="tip label num"
          aria-hidden="true"
          style="left: 62%; transform: translateX(-100%); margin-left: -8px"
        >
          <span class="muted">4 Nov</span><span>Roasted · −400 g</span><span>2,000 g green</span>
        </div>
      </div>
    </div>
    <div
      class="label muted num"
      aria-hidden="true"
      style="display: flex; justify-content: space-between; padding-left: 64px"
    >
      <span>12 Oct</span><span>Today</span>
    </div>
  </div>
</div>
<script></script>
